# Kira Graphics Metal backend — native linkage only.
#
# This library has NO sources: the Metal backend drives Metal, QuartzCore and
# AppKit/UIKit DIRECTLY from Kira through the Objective-C runtime (objc_getClass,
# sel_registerName, objc_msgSend) plus MTLCreateSystemDefaultDevice. There is no
# C/Objective-C shim. This descriptor exists purely to link the system frameworks
# and the Objective-C runtime, and to give the FFI a library handle to resolve
# those symbols against.
#
# Apple-only: no simulator, tvOS, xrOS, or non-Apple targets.

[library]
name = "kira_metal"
link_mode = "dynamic"
abi = "c"

[target.aarch64-macos-none]
frameworks = ["Foundation", "QuartzCore", "Metal", "AppKit"]
system_libs = ["objc"]

[target.aarch64-ios-none]
frameworks = ["Foundation", "QuartzCore", "Metal", "UIKit"]
system_libs = ["objc"]

# Browser target: the Metal backend is unavailable in the browser and is guarded at
# runtime (validateMetalBackend rejects non-Apple platforms). Empty artifact => nothing
# is linked, so eager resolution for any wasm app build succeeds instead of failing KTC003.
# The Metal backend's Objective-C runtime externs (objc_getClass, sel_registerName,
# objc_msgSend, ...) are still compiled into every KG app but have no objc runtime on the
# web; -sERROR_ON_UNDEFINED_SYMBOLS=0 turns those never-called (runtime-guarded) references
# into abort-on-call import stubs so the wasm link succeeds.
[target.wasm32-emscripten-unknown]
dynamic_lib = ""
linker_flags = ["-sERROR_ON_UNDEFINED_SYMBOLS=0"]
